# Integración Continua del Plan de Calidad (Mantenibilidad - ISO/IEC 25010)
# Ejecuta las pruebas unitarias con cobertura mínima del 70% en cada push.
name: Pruebas unitarias

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  phpunit:
    name: PHPUnit + cobertura
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: anuiesne_ehqa_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar PHP con Xdebug
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_mysql, zip
          coverage: xdebug

      - name: Instalar dependencias de Composer
        working-directory: Sitio-Web
        run: composer install --no-interaction --prefer-dist

      - name: Crear el .env de pruebas
        working-directory: Sitio-Web
        run: |
          cat > .env <<'EOF'
          APP_URL=http://localhost
          DB_CONNECTION=mysql
          DB_HOST=127.0.0.1
          DB_DATABASE=anuiesne_ehqa_test
          DB_USERNAME=root
          DB_PASSWORD=
          DB_PORT=3306
          DB_CHARSET=utf8mb4
          EOF

      - name: Importar el esquema oficial a la BD de pruebas
        run: mysql -h 127.0.0.1 -u root anuiesne_ehqa_test < docs/calidad/evidencias/esquema-anuiesne_ehqa.sql

      - name: PROBE php-m-xdebug
        run: php -m | grep -qi xdebug && exit 0 || exit 1

      - name: PROBE pdo-mysql
        run: php -m | grep -qi pdo_mysql && exit 0 || exit 1

      - name: PROBE vendor-phpunit-exec
        working-directory: Sitio-Web
        run: test -x vendor/bin/phpunit && exit 0 || exit 1

      - name: PROBE phpunit-version
        working-directory: Sitio-Web
        run: vendor/bin/phpunit --version

      - name: PROBE pdo-connect
        run: |
          php -r 'require_once "Sitio-Web/src/config/database.php"; $pdo = getPDO(); echo "PDO_CONNECT: " . $pdo->query("SELECT DATABASE() as d")->fetchColumn() . PHP_EOL;'

      - name: Ejecutar pruebas unitarias (ejecucion phpunit)
        working-directory: Sitio-Web
        run: |
          vendor/bin/phpunit --coverage-text > ../docs/calidad/evidencias/cobertura-resumen-ci.txt 2>&1 || echo "PHPUNIT_EXIT=$?" > ../docs/calidad/evidencias/probe-phpunit-exit.txt
          ls -la ../docs/calidad/evidencias/ | grep -i cobertura || true

      - name: RA1 reporte contiene "Failed asserting"
        working-directory: Sitio-Web
        run: |
          if grep -q "Failed asserting" ../docs/calidad/evidencias/cobertura-resumen-ci.txt; then echo "RA1: FALLO POR ASSERTION"; exit 1; else exit 0; fi

      - name: RA2 reporte contiene error critico
        working-directory: Sitio-Web
        run: |
          if grep -qiE "(PHP Fatal error|Uncaught Error|could not find driver|SQLSTATE|No tests executed)" ../docs/calidad/evidencias/cobertura-resumen-ci.txt; then echo "RA2: FALLO POR ERROR"; exit 1; else exit 0; fi

      - name: RA3 reporte completo sin marcador OK
        working-directory: Sitio-Web
        run: |
          if grep -q "Tests:" ../docs/calidad/evisencias/cobertura-resumen-ci.txt 2>/dev/null; then if ! grep -q "^OK (" ../docs/calidad/evisencias/cobertura-resumen-ci.txt 2>/dev/null; then echo "RA3: COMPLETADO SIN OK"; exit 1; else exit 0; fi; else exit 0; fi

      - name: RA4 phpunit exit code cero
        working-directory: Sitio-Web
        run: |
          code=$(sed -n 's/PHPUNIT_EXIT=//p' ../docs/calidad/evidencias/probe-phpunit-exit.txt 2>/dev/null)
          echo "phpunit exit code: ${code:-0}"
          if [ -z "$code" ]; then echo "NO EXIT CODE CAPTURADO"; exit 1; fi
          if [ "$code" = "0" ]; then exit 0; else echo "RA4: PHPUNIT FALLO con codigo $code"; exit 1; fi

      - name: Verificar cobertura (umbral 70%)
        working-directory: Sitio-Web
        run: |
          pct=$(grep -oE "Lines:\s+([0-9.]+)%" ../docs/calidad/evidencias/cobertura-resumen-ci.txt | head -n 1 | grep -oE "[0-9.]+")
          echo "Porcentaje de cobertura detectado: [$pct]"
          if [ -z "$pct" ]; then echo "No se pudo leer el porcentaje de cobertura"; exit 1; fi
          if awk -v p="$pct" 'BEGIN{exit !(p>=70)}'; then
            echo "Linea base de cobertura: $p% (>= 70)"
          else
            echo "Cobertura $pct% esta por debajo del minimo del 70%"; exit 1
          fi
